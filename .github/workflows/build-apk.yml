name: Build Android APK

on:
  # Tag memicu build RILIS yang ditandatangani release.keystore dan dilampirkan
  # ke halaman Releases. Dengan begitu tiap berkas APK punya nomor versi yang
  # jelas dan bisa ditelusuri ke commit tertentu — bukan sekadar "build terakhir
  # di suatu branch" yang mustahil dibedakan setelah beberapa minggu.
  push:
    tags: ['v*']
  # Dipicu manual dari tab Actions untuk menghasilkan build DEBUG dari branch
  # mana pun, tanpa perlu membuat tag palsu hanya untuk mencoba sesuatu.
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    # Diperlukan agar `gh release` boleh membuat rilis dan mengunggah berkas.
    # Sengaja dipersempit ke `contents` saja, bukan write-all.
    permissions:
      contents: write

    # Konteks `secrets` tidak tersedia di dalam `if:` milik step — kondisinya
    # akan selalu bernilai kosong dan step-nya diam-diam tidak pernah jalan.
    # Disalin ke env level job lebih dulu, karena `env` boleh membaca secrets.
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      # Bernilai string 'true' hanya saat dipicu oleh tag berawalan v.
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Gagal di detik pertama, bukan setelah lima menit kompilasi. Tanpa
      # kredensial, assembleRelease tetap "berhasil" tapi menghasilkan APK tak
      # bertanda tangan yang mustahil dipasang — kegagalan yang jauh lebih
      # membingungkan kalau baru ketahuan di akhir.
      - name: Verify release credentials are present
        if: env.IS_RELEASE == 'true'
        run: |
          missing=""
          [ -z "$RELEASE_KEYSTORE_BASE64" ]   && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ]         && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ]      && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secret berikut belum diatur:$missing"
            echo "Atur di Settings > Secrets and variables > Actions, lalu jalankan ulang."
            exit 1
          fi
          echo "Seluruh kredensial rilis tersedia."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app (Vite)
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Versi @capacitor/cli dan @capacitor/android dikunci mengikuti versi
      # @capacitor/core yang terpasang. Mismatch versi mayor antar paket
      # Capacitor adalah penyebab kegagalan build Gradle yang paling sering.
      - name: Install Capacitor CLI and Android platform
        run: |
          CAP_VERSION=$(node -p "require('@capacitor/core/package.json').version")
          echo "Capacitor core version: $CAP_VERSION"
          npm install --no-save "@capacitor/cli@$CAP_VERSION" "@capacitor/android@$CAP_VERSION"

      # Idempoten: bekerja baik saat folder android/ masih di-gitignore (dibuat
      # dari nol tiap run) maupun setelah folder itu di-commit ke repo — yang
      # nanti diperlukan agar editan AndroidManifest.xml tidak hilang.
      - name: Add or sync Android platform
        run: |
          if [ -d "android" ]; then
            echo "Folder android/ sudah ada -> menjalankan sync"
            npx cap sync android
          else
            echo "Folder android/ belum ada -> menambahkan platform"
            npx cap add android
          fi

      # Jaring pengaman. Runner ubuntu-latest sudah membawa Android SDK, tetapi
      # belum tentu memuat platform persis yang dipakai template Capacitor 8
      # (saat ini android-36). Ekstraksi memakai sed POSIX, bukan `grep -P`,
      # supaya tidak bergantung pada dukungan PCRE maupun locale runner.
      - name: Ensure required Android SDK platform
        run: |
          COMPILE_SDK=$(sed -n 's/.*compileSdkVersion[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' android/variables.gradle | head -1)
          echo "compileSdkVersion proyek: ${COMPILE_SDK:-tidak terdeteksi}"
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ -n "$COMPILE_SDK" ] && [ ! -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK" ]; then
            echo "Platform android-$COMPILE_SDK belum tersedia, menginstall..."
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-$COMPILE_SDK"
          fi

      # versionName diambil dari tag (v1.2.0 -> 1.2.0) supaya angka yang tampil
      # di layar Info aplikasi selalu cocok dengan tag yang membuatnya.
      #
      # versionCode memakai nomor run, bukan turunan dari tag. Alasannya, angka
      # ini wajib menaik dan tidak boleh berulang: menurunkannya membuat Android
      # menolak pembaruan, dan mengulanginya membuat rilis perbaikan mustahil
      # dipasang. Nomor run naik sendiri tanpa perlu diingat manusia.
      - name: Derive version from tag
        if: env.IS_RELEASE == 'true'
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$VERSION_NAME"   >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Membangun versi $VERSION_NAME (code ${GITHUB_RUN_NUMBER})"

      - name: Restore release keystore
        if: env.IS_RELEASE == 'true'
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Dibaca oleh build.gradle lewat System.getenv.
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "Keystore rilis dipulihkan ($(wc -c < "$RUNNER_TEMP/release.keystore") byte)."

      # Tanpa langkah ini, Gradle membuat debug keystore baru di setiap run —
      # runner selalu mesin bersih. Tanda tangan APK jadi berbeda tiap build,
      # Android menolak memasang pembaruan di atas versi lama, dan pengguna
      # harus uninstall lebih dulu. Karena seluruh data aplikasi ini hanya ada
      # di perangkat, itu berarti kehilangan seluruh koleksi setiap update.
      #
      # Keystore debug memakai kredensial baku Android (password `android`,
      # alias `androiddebugkey`), jadi tidak ada rahasia tambahan yang perlu
      # disimpan selain berkasnya sendiri.
      - name: Restore debug keystore
        if: env.IS_RELEASE != 'true' && env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          echo "Keystore dipulihkan dari secret."

      - name: Warn about unstable signature
        if: env.IS_RELEASE != 'true' && env.DEBUG_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Secret DEBUG_KEYSTORE_BASE64 belum diatur. Gradle akan"\
               "membuat keystore baru, sehingga APK ini TIDAK bisa dipasang menimpa"\
               "versi sebelumnya — uninstall dulu, dan seluruh data akan hilang."

      # chmod wajib: bit executable tidak selalu terbawa saat CLI Capacitor
      # menyalin gradlew dari template.
      # --no-daemon mencegah Gradle daemon menggantung dan membuat job hang.
      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          if [ "$IS_RELEASE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # Menentukan berkas mana yang dipakai, sekaligus memastikan APK rilis
      # benar-benar bertanda tangan. Kalau kredensial gagal terbaca, Gradle
      # tetap sukses tetapi menamai hasilnya app-release-unsigned.apk — berkas
      # yang mustahil dipasang. Kondisi itu digagalkan di sini supaya tidak
      # pernah terlanjur terbit sebagai aset rilis.
      - name: Locate and verify APK
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            OUT=android/app/build/outputs/apk/release
            if [ -f "$OUT/app-release-unsigned.apk" ]; then
              echo "::error::APK rilis tidak tertandatangani. Periksa kembali keempat secret."
              exit 1
            fi
            APK="$OUT/app-release.apk"
          else
            APK=android/app/build/outputs/apk/debug/app-debug.apk
          fi

          if [ ! -f "$APK" ]; then
            echo "::error::APK tidak ditemukan di $APK"
            ls -R android/app/build/outputs/apk || true
            exit 1
          fi

          echo "APK_FILE=$APK" >> "$GITHUB_ENV"
          echo "APK ditemukan: $APK ($(du -h "$APK" | cut -f1))"

      # Sidik jari sertifikat dicetak supaya konsistensi antar build bisa
      # diperiksa langsung dari log. Kalau nilainya berubah antara dua rilis,
      # APK yang baru tidak akan bisa dipasang menimpa yang lama.
      - name: Print signing fingerprint
        run: |
          keytool -printcert -jarfile "$APK_FILE" \
            | grep -E 'SHA256:|Owner:' || echo "Sidik jari tidak terbaca."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          # `ref_name` berisi nama tag saat dipicu tag, atau nama branch saat
          # dijalankan manual — jadi artifact-nya selalu bisa dikenali asalnya.
          name: rak-baca-${{ github.ref_name }}
          path: ${{ env.APK_FILE }}
          # Gagalkan job kalau APK ternyata tidak terbentuk, daripada sukses
          # dengan artifact kosong.
          if-no-files-found: error
          retention-days: 30

      # Artifact biasa kedaluwarsa dalam 30 hari dan hanya bisa diunduh sambil
      # login ke GitHub. Aset rilis bertahan selamanya dan bisa diunduh langsung
      # dari HP lewat tautan biasa — jauh lebih praktis untuk memasang sendiri.
      #
      # Memakai `gh` bawaan runner, bukan action pihak ketiga, supaya tidak ada
      # kode luar yang memegang token dengan izin tulis.
      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$APK_FILE" "rak-baca-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" \
            --title "Rak Baca $GITHUB_REF_NAME" \
            --generate-notes \
            "rak-baca-${GITHUB_REF_NAME}.apk" \
          || gh release upload "$GITHUB_REF_NAME" \
            "rak-baca-${GITHUB_REF_NAME}.apk" --clobber
